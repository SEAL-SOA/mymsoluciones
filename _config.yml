subtitle: "Ingeniería y Mantenimiento Industrial"
description: "Servicios de mantenimiento electromecánico, automatización industrial, programación de PLCs, reparación electrónica y líneas de inyección."
url: "https://mymsoluciones.github.io"
baseurl: ""
logo: "/assets/images/logo.svg"

# Contact Information
phone: "+54 9 11 2345-6789"
phone_link: "+5491123456789"
email: "info@mymsoluciones.com.ar"
whatsapp: "5491123456789"
