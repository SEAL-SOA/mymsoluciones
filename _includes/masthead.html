<!-- Top Contact Header -->
<div class="top-bar">
  <div class="container">
    <div class="top-bar__left">
      <a href="mailto:{{ site.email }}" class="top-bar__link">
        <svg class="top-bar__icon" width="16" height="16" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z"/>
          <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z"/>
        </svg>
        <span class="top-bar__text-full">{{ site.email }}</span>
        <span class="top-bar__text-short">Email</span>
      </a>
    </div>
    <div class="top-bar__right">
      <a href="tel:{{ site.phone_link }}" class="top-bar__link top-bar__link--phone">
        <svg class="top-bar__icon" width="16" height="16" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path d="M2 3a1 1 0 011-1h2.153a1 1 0 01.986.836l.74 4.435a1 1 0 01-.54 1.06l-1.548.773a11.037 11.037 0 006.105 6.105l.774-1.548a1 1 0 011.059-.54l4.435.74a1 1 0 01.836.986V17a1 1 0 01-1 1h-2C7.82 18 2 12.18 2 5V3z"/>
        </svg>
        <span class="top-bar__text-full">{{ site.phone }}</span>
        <span class="top-bar__text-short">Llamar</span>
      </a>
    </div>
  </div>
</div>

<!-- Main Sticky Header -->
<header class="site-masthead" id="main-masthead">
  <div class="container">
    <div class="site-masthead__inner">
      <a href="{{ '/' | relative_url }}" class="site-masthead__logo" aria-label="{{ site.title }}">
        {% if site.logo %}
          <img src="{{ site.logo | relative_url }}" alt="{{ site.title }}" width="180" height="42">
        {% else %}
          <span class="site-masthead__title">{{ site.title }}</span>
        {% endif %}
      </a>

      <button class="site-masthead__toggle" id="mobile-menu-btn" aria-label="Abrir menú de navegación" aria-expanded="false" aria-controls="mobile-menu">
        <svg class="hamburger-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>

      <nav class="site-masthead__nav" id="site-nav" aria-label="Navegación principal">
        {% for link in site.data.navigation.main %}
          <a href="{{ link.url }}" class="site-masthead__link{% if forloop.first %} is-active{% endif %}">{{ link.title }}</a>
        {% endfor %}
        <a href="https://wa.me/{{ site.whatsapp }}?text=Hola%2C%20quisiera%20consultar%20por%20servicios%20de%20mantenimiento%20y%20automatizaci%C3%B3n." target="_blank" rel="noopener" class="site-masthead__cta">
          Cotizar
        </a>
      </nav>
    </div>
  </div>

  <div class="site-masthead__mobile" id="mobile-menu" hidden>
    <div class="container">
      {% for link in site.data.navigation.main %}
        <a href="{{ link.url }}" class="site-masthead__mobile-link">{{ link.title }}</a>
      {% endfor %}
      <a href="https://wa.me/{{ site.whatsapp }}?text=Hola%2C%20quisiera%20consultar%20por%20servicios%20de%20mantenimiento%20y%20automatizaci%C3%B3n." target="_blank" rel="noopener" class="site-masthead__mobile-link site-masthead__mobile-link--highlight">
        Solicitar Presupuesto
      </a>
    </div>
  </div>
</header>

<script>
document.addEventListener('DOMContentLoaded', function () {
  var btn = document.getElementById('mobile-menu-btn');
  var menu = document.getElementById('mobile-menu');
  var masthead = document.getElementById('main-masthead');

  if (btn && menu) {
    btn.addEventListener('click', function () {
      var isHidden = menu.hasAttribute('hidden');
      if (isHidden) {
        menu.removeAttribute('hidden');
        btn.setAttribute('aria-expanded', 'true');
        btn.classList.add('is-open');
      } else {
        menu.setAttribute('hidden', '');
        btn.setAttribute('aria-expanded', 'false');
        btn.classList.remove('is-open');
      }
    });
  }

  // Smooth scroll handler for anchor links
  document.querySelectorAll('a[href^="#"]').forEach(function (anchor) {
    anchor.addEventListener('click', function (e) {
      var targetId = this.getAttribute('href');
      if (targetId === '#' || !targetId) return;
      var targetElement = document.querySelector(targetId);
      if (targetElement) {
        e.preventDefault();
        if (menu && !menu.hasAttribute('hidden')) {
          menu.setAttribute('hidden', '');
          if (btn) {
            btn.setAttribute('aria-expanded', 'false');
            btn.classList.remove('is-open');
          }
        }
        var offset = masthead ? masthead.offsetHeight + 10 : 80;
        var elementPosition = targetElement.getBoundingClientRect().top;
        var offsetPosition = elementPosition + window.pageYOffset - offset;
        window.scrollTo({
          top: offsetPosition,
          behavior: 'smooth'
        });
      }
    });
  });
});
</script>
